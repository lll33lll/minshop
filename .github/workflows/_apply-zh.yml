name: 应用中文化补丁

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_apply-zh.yml'

permissions:
  contents: write

concurrency:
  group: apply-zh
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 下载并校验补丁
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o /tmp/zh.patch "https://upload.223226.xyz/rl59zfa6qx3r6kcku0/minshop-zh.patch"
          echo "e16dacc22b929ee68e9f7482805fe96e7eef4219d049b844ffeb126ed1f88365  /tmp/zh.patch" | sha256sum -c -

      - name: git apply --check
        run: git apply --check --verbose /tmp/zh.patch

      - name: git apply
        run: git apply --stat /tmp/zh.patch && git apply /tmp/zh.patch

      - name: git 身份
        run: |
          git config user.name "minshop-bot"
          git config user.email "actions@users.noreply.github.com"

      - name: git add
        run: git add -A && git status --short | head -20

      - name: git commit
        run: git commit -m "i18n: 全站中文化 + 实例 wrangler 配置 + 部署工作流" -m "补丁 sha256: e16dacc22b929ee68e9f7482805fe96e7eef4219d049b844ffeb126ed1f88365"

      - name: git push
        run: git push 2>&1

      - name: 失败时记录日志
        if: failure()
        run: |
          {
            echo "# apply 失败诊断"
            echo "- 运行时间: $(date -u +%FT%TZ)"
            echo "- HEAD: $(git rev-parse HEAD)"
            echo
            echo '```'
            git apply --check --verbose /tmp/zh.patch 2>&1 || true
            echo '```'
          } > APPLY_ERROR.md || true
          git config user.name "minshop-bot"
          git config user.email "actions@users.noreply.github.com"
          git add APPLY_ERROR.md || true
          git commit -m "chore: apply 失败诊断日志" || echo "nothing to commit"
          git push || echo "push failed too"

  verify:
    needs: apply
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: 安装依赖
        run: npm ci

      - name: 跑全套 verify
        run: |
          set -o pipefail
          {
            echo "# verify 运行报告"
            echo
            echo "- 运行时间: $(date -u +%FT%TZ)"
            echo "- 提交: $(git rev-parse --short HEAD)"
            echo
            echo '```'
          } > VERIFY_REPORT.md
          if npm run verify 2>&1 | tee -a VERIFY_REPORT.md; then
            echo '```' >> VERIFY_REPORT.md
            echo "- 结果: ✅ 全部通过" >> VERIFY_REPORT.md
          else
            echo '```' >> VERIFY_REPORT.md
            echo "- 结果: ❌ 有失败项（见上方日志）" >> VERIFY_REPORT.md
          fi

      - name: 提交报告
        run: |
          git config user.name "minshop-bot"
          git config user.email "actions@users.noreply.github.com"
          git add VERIFY_REPORT.md
          git commit -m "chore: verify 运行报告" || echo "no changes"
          git push
