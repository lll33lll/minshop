name: 应用热修复补丁

on:
  push:
    branches: [main]
    paths:
      - 'patches/fix.patch'

permissions:
  contents: write

concurrency:
  group: hotfix-apply
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 应用补丁并提交
        run: |
          set -euo pipefail
          git apply --check patches/fix.patch
          git apply patches/fix.patch
          rm patches/fix.patch
          git config user.name "minshop-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: 收款码选择器事件分发修复（media:selected 按来源元素识别选择器）"
          git push
