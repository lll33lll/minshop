name: 部署 minshop

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'migrations/**'
      - 'public/**'
      - 'scripts/**'
      - 'wrangler.jsonc'
      - 'astro.config.mjs'
      - 'theme.config.json'
      - 'tsconfig.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-minshop
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: 未配置部署密钥则跳过
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: |
          echo "::notice::仓库 Secrets 未配置 CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID，本次跳过部署。配置后重新触发即可。"

      - name: 安装依赖
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm ci

      - name: 应用 D1 迁移
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler d1 migrations apply DB --remote

      - name: 构建
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx astro build

      - name: 部署 Worker
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler deploy
